name: Desktop build (.exe)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npm run desktop:build

      - name: Collect executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/hare-tortoise.exe "out/Hare-Tortoise-portable.exe"
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: hare-tortoise-windows
          path: out/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
